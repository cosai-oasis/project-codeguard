[project]
name = "project-codeguard"
version = "1.5.0"
description = "AI Coding Rules for Security and Best Practices"
requires-python = ">=3.11"
dependencies = [
    "pyyaml~=6.0.2",
    "mkdocs~=1.6.1",
    "mkdocs-material~=9.7.7",
]

[tool.uv]
# CVE floors for transitive deps
constraint-dependencies = [
    "urllib3>=2.7.0",
    "requests>=2.33.0",
    "pygments>=2.20.0",
    "idna>=3.15",
    "pymdown-extensions>=11.0.1",
    "click>=8.3.3",
]
# Supply-chain cooldown
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 3

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.format]
max-line-length = 100

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/codeguard-mcp"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
