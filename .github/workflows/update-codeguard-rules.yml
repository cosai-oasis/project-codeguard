---
name: Update CodeGuard Rules

on:
  schedule:
    - cron: "0 9 1 * *" # Monthly on the 1st at 9:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Force update even if version matches"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update CodeGuard rules
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Format configurations: directory -> zip asset name.
          declare -A FORMATS=(
            [".cursor/rules"]="codeguard-cursor.zip"
            [".windsurf/rules"]="codeguard-windsurf.zip"
            [".devin/skills/codeguard/rules"]="codeguard-devin.zip"
            [".github/instructions"]="codeguard-copilot.zip"
            [".agents/rules"]="codeguard-antigravity.zip"
            [".opencode/skills/codeguard/rules"]="codeguard-opencode.zip"
            [".agents/skills/codeguard/rules"]="codeguard-codex.zip"
            [".openclaw/skills/codeguard/rules"]="codeguard-openclaw.zip"
            [".hermes/skills/codeguard/rules"]="codeguard-hermes.zip"
          )

          # File patterns for each format
          declare -A PATTERNS=(
            [".cursor/rules"]="codeguard-*.mdc"
            [".windsurf/rules"]="codeguard-*.md"
            [".devin/skills/codeguard/rules"]="codeguard-*.md"
            [".github/instructions"]="codeguard-*.instructions.md"
            [".agents/rules"]="codeguard-*.md"
            [".opencode/skills/codeguard/rules"]="codeguard-*.md"
            [".agents/skills/codeguard/rules"]="codeguard-*.md"
            [".openclaw/skills/codeguard/rules"]="codeguard-*.md"
            [".hermes/skills/codeguard/rules"]="codeguard-*.md"
          )

          # Agent Skill rule directories -> their parent skill directories.
          # Keep each bundle's SKILL.md synchronized with its generated rules.
          declare -A SKILL_ROOTS=(
            [".devin/skills/codeguard/rules"]=".devin/skills/codeguard"
            [".opencode/skills/codeguard/rules"]=".opencode/skills/codeguard"
            [".agents/skills/codeguard/rules"]=".agents/skills/codeguard"
            [".openclaw/skills/codeguard/rules"]=".openclaw/skills/codeguard"
            [".hermes/skills/codeguard/rules"]=".hermes/skills/codeguard"
          )

          # Legacy paths: warn so users migrate instead of silently going stale.
          declare -A LEGACY_PATHS=(
            [".agent/rules"]="Antigravity (moved to .agents/rules/)"
            [".codex/skills/software-security/rules"]="Codex (moved to .agents/skills/codeguard/rules/)"
            [".codex/skills/codeguard/rules"]="Codex (moved to .agents/skills/codeguard/rules/)"
          )
          LEGACY_FOUND=""
          for legacy_dir in "${!LEGACY_PATHS[@]}"; do
            if [ -d "$legacy_dir" ] && ls "$legacy_dir"/codeguard-*.md* 1>/dev/null 2>&1; then
              echo "::warning::Legacy CodeGuard path detected at $legacy_dir (${LEGACY_PATHS[$legacy_dir]}). This path is no longer auto-updated — please migrate by moving its contents to the new location and deleting the old directory."
              LEGACY_FOUND="yes"
            fi
          done

          # Detect which formats exist
          DETECTED_DIRS=""
          for dir in "${!FORMATS[@]}"; do
            pattern="${PATTERNS[$dir]}"
            if [ -d "$dir" ] && ls "$dir"/$pattern 1>/dev/null 2>&1; then
              DETECTED_DIRS="$DETECTED_DIRS $dir"
              echo "Found: $dir"
            fi
          done
          DETECTED_DIRS=$(echo "$DETECTED_DIRS" | xargs)

          if [ -z "$DETECTED_DIRS" ]; then
            if [ -n "$LEGACY_FOUND" ]; then
              echo "::error::Only legacy CodeGuard paths were found. Nothing was updated. Migrate to the current layout (see warnings above) and re-run this workflow."
              exit 1
            fi
            echo "No CodeGuard rules directories found. Nothing to update."
            exit 0
          fi

          # Agent Skill rules do not carry a version field, so read their
          # version from SKILL.md. Update when detected formats disagree.
          CURRENT_VERSION=""
          for dir in $DETECTED_DIRS; do
            dir_version=""
            skill_root="${SKILL_ROOTS[$dir]:-}"
            if [ -n "$skill_root" ] && [ -f "$skill_root/SKILL.md" ]; then
              dir_version=$(sed -n 's/^codeguard-version: *"\([^"]*\)"/\1/p' "$skill_root/SKILL.md" | head -1)
            else
              pattern="${PATTERNS[$dir]}"
              dir_version=$(grep -h "^version:" "$dir"/$pattern 2>/dev/null | head -1 | awk '{print $2}') || true
            fi
            dir_version="${dir_version:-0.0.0}"

            if [ -z "$CURRENT_VERSION" ]; then
              CURRENT_VERSION="$dir_version"
            elif [ "$CURRENT_VERSION" != "$dir_version" ]; then
              CURRENT_VERSION="mixed"
              break
            fi
          done
          CURRENT_VERSION="${CURRENT_VERSION:-0.0.0}"
          echo "Current version: $CURRENT_VERSION"

          # Fetch latest release info
          RELEASE=$(curl -sfS "https://api.github.com/repos/cosai-oasis/project-codeguard/releases/latest") || {
            echo "::error::Failed to fetch latest release from GitHub API"
            exit 1
          }
          LATEST_VERSION=$(echo "$RELEASE" | jq -r '.tag_name' | sed 's/^v//')
          RELEASE_URL=$(echo "$RELEASE" | jq -r '.html_url')

          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
            echo "::error::Invalid release data from GitHub API"
            exit 1
          fi
          echo "Latest version: $LATEST_VERSION"

          # Check if update needed
          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ] && [ "$FORCE" != "true" ]; then
            echo "Already up to date (v$CURRENT_VERSION)"
            exit 0
          fi
          echo "Updating: v$CURRENT_VERSION -> v$LATEST_VERSION"

          # Download and extract each format's zip asset
          UPDATED=""
          for dir in $DETECTED_DIRS; do
            asset="${FORMATS[$dir]}"
            pattern="${PATTERNS[$dir]}"
            
            # Get download URL for this asset
            ASSET_URL=$(echo "$RELEASE" | jq -r ".assets[] | select(.name == \"$asset\") | .browser_download_url")
            
            if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
              echo "Warning: Asset $asset not found in release"
              continue
            fi

            echo "Downloading $asset..."
            mkdir -p /tmp/codeguard-update
            curl -sfSL "$ASSET_URL" -o "/tmp/codeguard-update/$asset" || {
              echo "Warning: Failed to download $asset"
              continue
            }

            # Extract and validate the archive before replacing existing files.
            unzip -q -o "/tmp/codeguard-update/$asset" -d /tmp/codeguard-update/

            SOURCE_DIR="/tmp/codeguard-update/$dir"
            skill_root="${SKILL_ROOTS[$dir]:-}"
            source_skill=""
            if [ -n "$skill_root" ]; then
              source_skill="/tmp/codeguard-update/$skill_root/SKILL.md"
            fi

            if [ ! -d "$SOURCE_DIR" ] || ! ls "$SOURCE_DIR"/$pattern 1>/dev/null 2>&1; then
              echo "Warning: No files found in $SOURCE_DIR"
              rm -rf /tmp/codeguard-update/*
              continue
            fi
            if [ -n "$source_skill" ] && [ ! -f "$source_skill" ]; then
              echo "Warning: SKILL.md not found in $asset"
              rm -rf /tmp/codeguard-update/*
              continue
            fi

            rm -f "$dir"/$pattern 2>/dev/null || true
            cp "$SOURCE_DIR"/$pattern "$dir/"
            if [ -n "$source_skill" ]; then
              mkdir -p "$skill_root"
              cp "$source_skill" "$skill_root/SKILL.md"
            fi

            if ls "$dir"/$pattern 1>/dev/null 2>&1; then
              UPDATED="$UPDATED $dir"
              echo "Updated: $dir"
            else
              echo "Warning: Failed to update $dir"
            fi

            rm -rf /tmp/codeguard-update/*
          done
          UPDATED=$(echo "$UPDATED" | xargs)

          if [ -z "$UPDATED" ]; then
            echo "No formats were updated"
            exit 0
          fi

          if git diff --quiet; then
            echo "No file changes detected"
            exit 0
          fi

          # Create branch and commit
          BRANCH="codeguard-rules-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add .
          git commit -m "chore: Update CodeGuard rules to v$LATEST_VERSION"
          git push -f origin "$BRANCH"

          # Create or update PR
          UPDATED_BULLETS=$(echo "$UPDATED" | tr ' ' '\n' | sed 's/^/- /')
          PR_BODY=$(printf '%s\n\n%s\n%s\n\n%s\n\n%s\n%s' \
            "Updates CodeGuard security rules to **v$LATEST_VERSION**." \
            "**Updated:**" \
            "${UPDATED_BULLETS}" \
            "**Release notes:** ${RELEASE_URL}" \
            "---" \
            "*Auto-generated by [update-codeguard-rules](.github/workflows/update-codeguard-rules.yml)*")

          if gh pr list --head "$BRANCH" --state open | grep -q .; then
            gh pr edit "$BRANCH" --title "chore: Update CodeGuard rules to v$LATEST_VERSION" --body "$PR_BODY"
          else
            gh pr create --base "${DEFAULT_BRANCH:-main}" --head "$BRANCH" \
              --title "chore: Update CodeGuard rules to v$LATEST_VERSION" --body "$PR_BODY"
          fi

          echo "Done! PR created/updated for v$LATEST_VERSION"
