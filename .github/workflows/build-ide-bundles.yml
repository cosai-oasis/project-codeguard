---
name: Build and Release CodeGuard Skill

on:
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout released revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Validate versions match tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: uv run --locked python src/validate_versions.py "${TAG#v}"

      - name: Package CodeGuard
        shell: bash
        run: |
          (cd skills && zip -r ../codeguard-skill.zip codeguard/)
          zip codeguard-skill.zip LICENSE.md
          sha256sum codeguard-skill.zip > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" codeguard-skill.zip SHA256SUMS
