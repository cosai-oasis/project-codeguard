---
name: Validate Rules

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/workflows/validate-rules.yml'
      - 'sources/**'
      - 'src/**'
      - 'pyproject.toml'
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/validate-rules.yml'
      - 'sources/**'
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync

      - name: Validate unified rules
        run: uv run python src/validate_unified_rules.py sources/

      - name: Check required core rule files exist
        run: |
          echo "Checking for required core rule files..."
          required_files=(
            "sources/rules/core/codeguard-1-hardcoded-credentials.md"
            "sources/rules/core/codeguard-1-crypto-algorithms.md"
            "sources/rules/core/codeguard-1-digital-certificates.md"
            "sources/rules/core/codeguard-SKILLS.md.template"
          )
          
          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              missing=1
            else
              echo "✅ Found: $file"
            fi
          done
          
          if [ $missing -eq 1 ]; then
            exit 1
          fi

      - name: Check generated artifacts are up-to-date
        run: |
          echo "Checking if committed skills/codeguard/, .apm/, and apm.yml are up-to-date..."

          cp -r skills/codeguard skills-committed
          cp -r .apm apm-committed
          cp apm.yml apm-yml-committed

          uv run python src/convert_to_ide_formats.py

          if ! diff -r skills/codeguard/ skills-committed/ > /dev/null 2>&1; then
            echo "❌ skills/codeguard/ is out of date!"
            echo "Please regenerate by running: uv run python src/convert_to_ide_formats.py"
            echo "Then: git add skills/codeguard/"
            diff -r skills/codeguard/ skills-committed/ || true
            rm -rf skills-committed apm-committed apm-yml-committed
            exit 1
          fi
          echo "✅ skills/codeguard/ is up-to-date"

          if ! diff -r .apm/ apm-committed/ > /dev/null 2>&1; then
            echo "❌ .apm/ is out of date!"
            echo "Please regenerate by running: uv run python src/convert_to_ide_formats.py"
            echo "Then: git add .apm/"
            diff -r .apm/ apm-committed/ || true
            rm -rf skills-committed apm-committed apm-yml-committed
            exit 1
          fi
          echo "✅ .apm/ is up-to-date"

          if ! diff apm.yml apm-yml-committed > /dev/null 2>&1; then
            echo "❌ apm.yml is out of date!"
            diff apm.yml apm-yml-committed || true
            rm -rf skills-committed apm-committed apm-yml-committed
            exit 1
          fi
          echo "✅ apm.yml is up-to-date"

          rm -rf skills-committed apm-committed apm-yml-committed

      - name: Test conversion to IDE formats
        run: |
          echo "Testing IDE format conversion..."
          uv run python src/convert_to_ide_formats.py --output-dir test-output
          
          # Check that files were generated
          if [ ! -d "test-output/.cursor" ]; then
            echo "❌ Cursor rules not generated"
            exit 1
          fi
          
          if [ ! -d "test-output/.windsurf" ]; then
            echo "❌ Windsurf rules not generated"
            exit 1
          fi
          
          if [ ! -d "test-output/.github" ]; then
            echo "❌ Copilot instructions not generated"
            exit 1
          fi
          
          if [ ! -d "test-output/.agents/rules" ]; then
            echo "❌ Antigravity rules not generated at .agents/rules/"
            exit 1
          fi

          if [ ! -d "test-output/.opencode" ]; then
            echo "❌ OpenCode rules not generated"
            exit 1
          fi

          # Codex discovers skills under .agents/skills/ (not .codex/skills/).
          # See src/formats/codex.py for the rationale.
          if [ ! -d "test-output/.agents/skills/codeguard" ]; then
            echo "❌ Codex skill not generated at .agents/skills/codeguard/"
            exit 1
          fi

          if [ ! -d "test-output/.openclaw" ]; then
            echo "❌ OpenClaw rules not generated"
            exit 1
          fi

          if [ ! -d "test-output/.hermes" ]; then
            echo "❌ Hermes rules not generated"
            exit 1
          fi

          AGENT_HOSTS=(
            ".claude:.claude/skills/codeguard/rules:agents/codeguard-reviewer.md"
            ".cursor:.cursor/rules:agents/codeguard-reviewer.md"
            ".opencode:.opencode/skills/codeguard/rules:agents/codeguard-reviewer.md"
            ".github:.github/instructions:agents/codeguard-reviewer.agent.md"
          )
          for entry in "${AGENT_HOSTS[@]}"; do
            h="${entry%%:*}"
            rest="${entry#*:}"
            rules_dir="${rest%%:*}"
            agent_file="${rest#*:}"
            test -f "test-output/$h/$agent_file" || { echo "❌ $h $agent_file missing"; exit 1; }
            find "test-output/$rules_dir" -name 'codeguard-*.md*' 2>/dev/null | grep -q . || { echo "❌ $rules_dir has no rule files"; exit 1; }
            if find "test-output/$h/agents" -name 'codeguard-[0-9]-*' 2>/dev/null | grep -q .; then
              echo "❌ rule files leaked into $h/agents/ (would be misread as agents)"
              exit 1
            fi
            echo "✅ $h agent bundle (rules: $rules_dir)"
          done

          test -f "test-output/.codex/agents/codeguard-reviewer.toml" || { echo "❌ Codex codeguard-reviewer.toml missing"; exit 1; }
          find "test-output/.agents/skills/codeguard/rules" -name 'codeguard-*.md' 2>/dev/null | grep -q . || { echo "❌ Codex skill rules missing"; exit 1; }
          python - <<'PY'
          from pathlib import Path
          import tomllib

          agent = tomllib.loads(Path("test-output/.codex/agents/codeguard-reviewer.toml").read_text())
          assert agent["name"] == "codeguard-reviewer"
          assert "description" in agent
          assert ".agents/skills/codeguard/rules" in agent["developer_instructions"]
          PY
          echo "✅ Codex agent bundle (rules: .agents/skills/codeguard/rules)"

          echo "✅ All IDE formats generated successfully"

      - name: Test core and OWASP conversion together
        run: uv run python src/convert_to_ide_formats.py --source core owasp --output-dir /tmp/validate-all-output

      - name: Summary
        if: success()
        run: |
          echo "✅ All validation checks passed!"
          echo ""
          echo "Rule validation: ✅"
          echo "Required files: ✅"
          echo "IDE conversion: ✅"
          echo "Skills directory: ✅"
          echo "APM package: ✅"

      - name: Install APM CLI
        run: |
          brew install microsoft/apm/apm
          apm --version

      - name: Validate APM install
        run: |
          chmod +x scripts/validate_apm_install.sh
          ./scripts/validate_apm_install.sh
