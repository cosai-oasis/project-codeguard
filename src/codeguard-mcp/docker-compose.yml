services:
  codeguard-mcp:
    build:
      context: ../..
      dockerfile: src/codeguard-mcp/Dockerfile
    container_name: codeguard-mcp
    ports:
      - target: 8080
        published: "${CODEGUARD_PORT:-8080}"
        host_ip: "${CODEGUARD_PUBLISH_ADDRESS:-127.0.0.1}"
    environment:
      - CODEGUARD_LOG_LEVEL=${CODEGUARD_LOG_LEVEL:-INFO}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
