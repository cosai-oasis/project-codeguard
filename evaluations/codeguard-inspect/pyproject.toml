[project]
name = "codeguard-inspect-evaluations"
version = "0.1.0"
description = "Inspect AI evaluations for Project CodeGuard"
requires-python = ">=3.11"
# This is a reproducible evaluation application, not a reusable library.
# Exact runtime pins prevent framework and scorer upgrades from changing results.
dependencies = [
    "bandit==1.9.4",
    "huggingface-hub==1.16.1",
    "inspect-ai==0.3.246",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codeguard_evals"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=8.0",
]

[tool.uv]
# Inspect 0.3.246's published metadata conflicts with patched Click. This
# uv-only environment tests the exercised Inspect commands with 8.4.2.
override-dependencies = ["click==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
