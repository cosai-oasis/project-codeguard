[project]
name = "codeguard-inspect-evaluations"
version = "0.3.0"
description = "Inspect AI evaluations for Project CodeGuard"
requires-python = ">=3.13,<3.14"
# This is a reproducible evaluation application, not a reusable library.
# Exact runtime pins prevent framework and scorer upgrades from changing results.
dependencies = [
    "huggingface-hub==1.26.0",
    "inspect-ai==0.3.277",
    "inspect-swe==0.2.71",
    "openai==3.26.0",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
reporting = [
    "matplotlib==3.11.2",
]

[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "fsspec>=2026.6.0",
    "multidict>=6.9.1",
    "soupsieve>=2.9.0",
    "urllib3>=2.8.0",
]
exclude-newer = "7 days"
# Apply the supply-chain cooldown to every package; do not add exceptions.

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "codeguard_evals"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not docker and not artifacts"]
markers = [
    "artifacts: offline checks requiring explicitly prefetched benchmark artifacts",
    "docker: explicitly enabled tests that launch Docker and a mock-backed Codex CLI",
]
